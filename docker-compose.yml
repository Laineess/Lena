# Leña — entorno de desarrollo local.
# Para el VPS ver docker-compose.prod.yml y Docs/11.-Despliegue en VPS.md
#
#   docker compose up -d postgres
#   docker compose down          (conserva los datos)
#   docker compose down -v       (BORRA los datos)

services:
  postgres:
    image: postgres:16-alpine
    container_name: lena-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiame_en_local}
      POSTGRES_DB: ${POSTGRES_DB:-lena}
      # RES-4: el corte del día es a medianoche local, no UTC.
      TZ: America/Mexico_City
      PGTZ: America/Mexico_City
    ports:
      # Solo en la interfaz local. En producción Postgres NO se expone (RS-T-6).
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lena} -d ${POSTGRES_DB:-lena}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    name: lena-postgres-data
